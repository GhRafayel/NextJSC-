events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    access_log    off;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:4000;
    }

    # The websocket gateway shares the main Nest HTTP server's port (4000).
    upstream backend_ws {
        server backend:4000;
    }

    # Redirect all HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Next.js's own internal API routes (frontend/src/app/api/*) — these
        # must be matched before the /api/ catch-all below, or they'd be sent
        # to the backend (which has no matching routes) instead of Next.js.
        # Note: only these EXACT paths are special-cased. Sub-paths such as
        # /api/auth/google and /api/auth/google/callback intentionally fall
        # through to the backend catch-all below (that's where the NestJS
        # OAuth routes live).
        location = /api/edit {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /api/auth {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /api/avatars {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /api/socket-token {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # REST API — Nest has a global prefix of 'api', so the /api/ prefix
        # must be preserved when forwarding (no trailing slash on proxy_pass).
        # e.g. GET /api/users  ->  GET http://backend/api/users
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /_next/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
    
            # These three lines are the "Secret Sauce" for WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            # Prevents the connection from dropping too early
            proxy_cache_bypass $http_upgrade;
        }   

        # Socket.IO — must support both WebSocket upgrade and HTTP long-polling.
        # The gateway shares the main Nest HTTP server's port (see upstream backend_ws).
        location /socket.io/ {
            proxy_pass         http://backend_ws/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 86400;
        }

        # Next.js Hot Module Replacement WebSocket (dev only)
        location /_next/webpack-hmr {
            proxy_pass         http://frontend/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # Everything else goes to Next.js
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}